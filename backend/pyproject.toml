[project]
name = "sdf-manager-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "python-dotenv>=1.0",
    "scalar-fastapi>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "import-linter>=2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas da Clean Architecture (ADR 0003)"
type = "layers"
layers = [
    "src.api",
    "src.application | src.infrastructure",
    "src.domain",
]

[[tool.importlinter.contracts]]
name = "Domain não depende de SQLAlchemy nem FastAPI (ADR 0003)"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = ["sqlalchemy", "fastapi"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
